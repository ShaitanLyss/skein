# Builds Skein on a real MSVC runner, which is the toolchain the machine this is
# developed on does not have. Consequences worth knowing, all of them good:
#
#   - No `windres` shim and no gnu toolchain — see CLAUDE.md, "Building without MSVC".
#   - WebView2Loader links *statically* here (webview2-com-sys picks WebView2LoaderStatic
#     on target_env = "msvc"), so there is no loose DLL to ship and no `--config` overlay.
#   - `cargo test` runs. On gnu the harness exe dies at load with 0xC0000139 before any
#     test executes, so the Rust suites have never run on the dev machine at all.
#
# It deliberately does NOT build on every push. The repo is public, so GitHub-hosted
# minutes are free and this is not about cost — it is that commits here are frequent and
# small, and a release build per commit is noise: a run history where every entry is
# meaningful is worth more than one that logs every keystroke. (If skein ever goes private
# again the cost argument returns on top: Windows runners bill at 2x, and a cold build is
# ~405 crates.) Builds are batched three ways:
#
#   tag v*            an explicit release — you decide the batch boundary
#   schedule          at most one build a day, and only if something landed (see `gate`)
#   workflow_dispatch on demand, from the Actions tab
#
name: release

on:
  push:
    tags: ['v*']
  schedule:
    # 03:00 UTC. N commits in a day collapse into one build; a quiet day builds nothing.
    - cron: '0 3 * * *'
  workflow_dispatch:

# A re-tag or a second dispatch supersedes the run in flight rather than paying for both.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # needed only by the `release` step, to upload installers

jobs:
  # Runs on Linux at 1x minutes purely to decide whether to spend the Windows runner.
  # A scheduled build on a day with no commits would otherwise cost ~30-50 billed minutes
  # to rebuild something identical.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # `git log --since` needs real history

      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "a tag or a manual run is always deliberate — building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "commits in the last 24h:"
            git log --since='24 hours ago' --oneline
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing landed in 24h — skipping the windows runner"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60         # a runaway build must not eat the month
    env:
      # Presence of this decides whether the signing step runs at all, so the workflow is
      # green today and signs the moment the secret exists. See the step for the caveat.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # svelte-check + tsc over src/**
      - name: check
        run: bun run check

      # The pure suites: ansi, classify, layout, specs, history, menu, markdown, actions,
      # outline, ambience, transcript, commands. Deliberately not `test:live` (spends real
      # API money) and not `test:wall` (drives a running app, which CI has not got).
      - name: pure suites
        run: bun run test

      # store.rs, ask.rs, control.rs, supervisor.rs, servers.rs, sessions.rs, project.rs.
      # First place these have ever run — expect to iterate on anything that assumed a
      # desktop session or a `claude` binary on PATH.
      - name: rust suites
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: build
        run: bun run tauri build

      # Inert until a certificate exists. Two things to know when wiring it up:
      #
      #   - SignPath Foundation is free for OSS but signs *submitted artifacts*, so this
      #     signs the finished installers. The skein.exe *inside* them stays unsigned
      #     unless you also sign it before bundling, via tauri.conf.json's
      #     bundle.windows.signCommand. The inner exe is the one an EDR watches at
      #     runtime, so it is the one that matters here — the installer signature only
      #     buys you SmartScreen on download.
      #   - Signing does not stop a behavioural detection. It buys reputation for a hash
      #     that is otherwise brand new on every build.
      - name: sign
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          echo "TODO: SignPath/github-action-submit-signing-request once the org, project"
          echo "and signing-policy slugs exist. Left as a no-op so the secret alone does"
          echo "not fail the build."

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skein-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      # Only a tag produces a Release. A nightly leaves artifacts and nothing else, or the
      # releases page would fill up with builds nobody asked for.
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Skein ${GITHUB_REF_NAME}" \
            --generate-notes \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*-setup.exe
